name: Bug report
description: Something in Vinq is broken or behaves wrongly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste passwords, API keys or other players' private info.
        To report a **player** (harassment, cheating), use the in-app Report button instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Lobbies
        2. Tap "Host lobby"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Installed app (beta build)
        - Expo Go (local dev)
        - Web
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android/iOS version
      placeholder: Redmi Note 12, Android 14
  - type: input
    id: theme
    attributes:
      label: Theme in use
      placeholder: Protocol / Defuse / Ronin / custom
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recording or error text
